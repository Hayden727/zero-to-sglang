name: Part II Chapter 10 examples

on:
  pull_request:
    paths:
      - 'examples/part2/chapter10/**'
      - 'course-material/ch/part2/第10章_投机解码_代码.md'
      - '.github/workflows/part2-chapter10.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: Chapter 10 correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run example and tests offline
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python examples/part2/chapter10/speculative.py
          python -m unittest examples.part2.chapter10.test_speculative -v
