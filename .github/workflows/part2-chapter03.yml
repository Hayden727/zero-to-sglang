name: Part II Chapter 3 examples

on:
  pull_request:
    paths:
      - 'examples/part2/chapter03/**'
      - 'course-material/ch/part2/第3章_前向与生成_代码.md'
      - 'course-material/eng/part2/Chapter3_Forward-Pass-and-Generation_code.md'
      - '.github/workflows/part2-chapter03.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    name: Chapter 3 correctness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r examples/part2/chapter03/requirements.txt
      - name: Run example and tests offline
        env:
          HF_HUB_OFFLINE: '1'
          TRANSFORMERS_OFFLINE: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python examples/part2/chapter03/forward.py
          python -m pytest examples/part2/chapter03 -q
